<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ECHO — Last Signal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading"><div class="loader"></div><div>LOADING ECHO</div></div>
<canvas id="game"></canvas>

<section id="mainMenu" class="screen">
  <div class="menu">
    <div class="kicker">ORIGINAL SURVIVAL ADVENTURE</div>
    <h1>ECHO</h1><h2>LAST SIGNAL</h2>
    <p>The coast stopped answering three nights ago.</p>
    <button id="newGame">NEW EXPEDITION</button>
    <button id="continueGame">CONTINUE</button>
    <button id="settingsOpen">SETTINGS</button>
    <small>WebGL • Local Save • No Database</small>
  </div>
</section>

<section id="settings" class="screen hidden">
  <div class="panel">
    <h2>SETTINGS</h2>
    <label>Quality <select id="quality"><option value="1">High</option><option value=".75">Medium</option><option value=".5">Low</option></select></label>
    <label>Mouse sensitivity <input id="sens" type="range" min=".5" max="2" step=".1" value="1"></label>
    <button id="settingsBack">BACK</button>
  </div>
</section>

<section id="pause" class="screen hidden">
  <div class="panel"><h2>PAUSED</h2><button id="resume">RESUME</button><button id="save">SAVE</button><button id="home">MAIN MENU</button></div>
</section>

<section id="hud" class="hidden">
  <div class="top">
    <div class="logo">ECHO <span>LAST SIGNAL</span></div>
    <div id="objective">Reach the relay tower.</div>
    <button id="pauseBtn">Ⅱ</button>
  </div>
  <div class="reticle">+</div>
  <div id="notice"></div>
  <div class="bottom">
    <div class="bars">
      <div>HEALTH <i><b id="hp"></b></i></div>
      <div>ENERGY <i><b id="energy"></b></i></div>
      <strong id="ammo">12 / 36</strong>
    </div>
    <div class="controls"><button id="dash">DASH</button><button id="use">USE</button><button id="fire">FIRE</button></div>
    <div id="joystick"><div id="stick"></div></div>
  </div>
</section>

<script type="module" src="game.js"></script>
</body>
</html>
